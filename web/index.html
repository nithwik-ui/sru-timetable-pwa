<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="SRU Timetable Official Application">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timetable">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SRU Timetable</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      overscroll-behavior: none;
      background-color: #F7F9FC; /* Prevent white flash */
    }
  </style>
</head>
<body style="overscroll-behavior: none;">
  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isMacTouch = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      var isTest = window.location.search.indexOf('test=true') > -1;
      
      if (!isIOS && !isMacTouch && !isTest) {
        window.location.replace('https://play.google.com/store/apps/details?id=com.srutimetable.mobile');
      }
    })();
    window.addEventListener('error', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'color:red;font-size:16px;padding:20px;background:white;position:absolute;z-index:9999;top:0;left:0;width:100%;word-wrap:break-word;';
      d.innerHTML = '<b>JS Error:</b> ' + e.message + '<br><small>' + e.filename + ':' + e.lineno + '</small>';
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'color:red;font-size:16px;padding:20px;background:white;position:absolute;z-index:9999;top:0;left:0;width:100%;word-wrap:break-word;';
      d.innerHTML = '<b>Promise Error:</b> ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      document.body.appendChild(d);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
